[project]
name = "hangar-avy"
version = "0.1.0"
description = "NASA Aviary MCP server for agentic aircraft sizing and mission optimization"
requires-python = ">=3.11"
dependencies = [
    "hangar-sdk[all]",
    # Aviary v1.0.1 (pinned by AVY_REF in scripts/upstream-pins.env, installed
    # editable from upstream/Aviary). openaerostruct + ambiance are what the
    # oas_wing_mass external subsystem needs (upstream's OAS integration).
    "aviary>=1.0.1",
    "openaerostruct>=2.12,<3",
    "ambiance",
    "openmdao>=3.43",
    "numpy>=2,<2.4",
    "matplotlib",
]

[project.scripts]
avy-server = "hangar.avy.server:main"
avy-cli    = "hangar.avy.cli:main"

[project.entry-points."hangar.study_runners"]
avy = "hangar.avy.study_runner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hangar"]

[tool.uv.sources]
hangar-sdk = { workspace = true }
# For development: use local upstream clones (scripts/setup-upstream.sh)
aviary = { path = "../../upstream/Aviary", editable = true }
openaerostruct = { path = "../../upstream/OpenAeroStruct", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "golden_physics: physics-invariant golden tests",
    "parity: parity tests vs direct Aviary API",
]
