metadata:
  id: ex-oas-avy-wing-mass
  name: OAS structural wing mass -> Aviary sizing (loose coupling)
  version: 1
  description: >
    Native multitool composition: an OAS aerostructural wing computes a
    structural wing mass that a plan connection feeds straight into
    Aviary's aircraft:wing:mass -- one OpenMDAO problem, one driver.
    Giving aircraft:wing:mass a deck value ('overrides') is Aviary's own
    override mechanism: the FLOPS wing-mass output is renamed away and
    the variable becomes a boundary input the connection drives. The
    connection converts kg -> lbm (OpenMDAO units on both sides).
    One-way coupling, mode=optimize (the Aviary sizing is the
    optimization; the wingbox solves once per evaluation, Newton
    aerostructural). The wing is a single-aisle-SCALED rect tube
    surface -- this case certifies the composition plumbing; the
    physically-grounded wing-mass study is avy_oas_wing (upstream's own
    wingbox integration).

operating_points:
  velocity: 231.5
  alpha: 3.0
  Mach_number: 0.785
  re: 1.0e+6
  rho: 0.38

composition_policy: explicit

components:
- id: wingbox
  type: oas/AerostructPoint
  config:
    surfaces:
    - name: wing
      wing_type: rect
      num_x: 2
      num_y: 7
      span: 35.0
      root_chord: 4.2
      symmetry: true
      fem_model_type: tube
      E: 7.0e+10
      G: 3.0e+10
      yield_stress: 5.0e+8
      mrho: 2780.0
      thickness_cp: [0.015, 0.02, 0.015]
      with_viscous: true
- id: sizing
  type: avy/Sizing
  config:
    deck: models/aircraft/advanced_single_aisle/advanced_single_aisle_FLOPS.csv
    phase_info_module: aviary.models.missions.energy_state_default
    # A deck value for a normally-computed variable makes it a boundary
    # input (Aviary override); the connection below then drives it.
    overrides:
      aircraft:wing:mass: [15000.0, lbm]
    optimizer: SLSQP
    max_iter: 50

solvers:
- target: wingbox.AS_point_0.coupled
  nonlinear:
    type: NewtonSolver
    options:
      maxiter: 20
      atol: 1.0e-6
  linear:
    type: DirectSolver

connections:
- src: wingbox.wing.structural_mass
  tgt: sizing.aircraft:wing:mass
