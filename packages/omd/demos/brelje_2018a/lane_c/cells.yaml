# Reference cells for Lane C one-by-one reproduction.
#
# Each entry is a (design_range_NM, battery_specific_energy_Wh_per_kg)
# pair from the Brelje 2018a paper or the omd 11x12 sweep, with the
# expected converged values that a Lane C run must match.
#
# Format:
#   id:        short slug used in output filenames
#   range_nm:  mission range in nautical miles
#   spec_e:    battery pack specific energy in Wh/kg
#   objective: fuel | cost
#   source:    upstream-truth (results/lane_a_upstream/fig{5,6}_*.csv,
#                              OpenConcept's own HybridTwin MDO) or
#              omd-sweep      (taken from results/fig{5,6}_grid.csv)
#   expect:    optional hand-entered target values (overrides source)
#   tol_pct:   relative tolerance for the check (default 5).

cells:
  # ---- 500 nmi reference column (formerly "paper-table-4") ----
  # These cells used to carry hand-entered "Brelje Table 4" values
  # (e.g. 382.4 kg / 754 lb fuel / 330 lb battery at 250 Wh/kg, and an
  # 8627 lb battery inside a 12505 lb MTOW at 750 Wh/kg -- infeasible).
  # They match neither the published figures (paper_ref/, digitized)
  # nor OpenConcept's own HybridTwin MDO, so expected values now come
  # from the upstream truth lane (lane_a_upstream/upstream_truth.py,
  # results/lane_a_upstream/). stats/collect_stats.py scores that truth
  # against the digitized paper figures.
  - id: paper-fuel-500-250
    range_nm: 500
    spec_e:   250
    objective: fuel
    source: upstream-truth
    tol_pct: 5

  - id: paper-fuel-500-500
    range_nm: 500
    spec_e:   500
    objective: fuel
    source: upstream-truth
    tol_pct: 5

  - id: paper-fuel-500-750
    range_nm: 500
    spec_e:   750
    objective: fuel
    source: upstream-truth
    tol_pct: 8     # all-electric: S_ref and battery sit on a flat ridge

  # ---- Easy mid-grid sanity check ----
  - id: omd-fuel-450-450
    range_nm: 450
    spec_e:   450
    objective: fuel
    source: omd-sweep
    tol_pct: 3

  # ---- Boundary / hard cell (post-rescue) ----
  - id: omd-fuel-700-450
    range_nm: 700
    spec_e:   450
    objective: fuel
    source: omd-sweep
    tol_pct: 3

  # ---- Cost objective sanity check ----
  - id: omd-cost-500-450
    range_nm: 500
    spec_e:   450
    objective: cost
    source: omd-sweep
    tol_pct: 3
